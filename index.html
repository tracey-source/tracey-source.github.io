<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F26A21">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Squisito">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Squisito Business — Quotations &amp; Receipts</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<style>
:root{
  --orange:#F26A21; --orange-d:#D9531A; --gold:#FBA919; --gold-l:#FDC24A;
  --ink:#241a12; --ink-soft:#6f6154; --muted:#948779; --line:#ece3d8; --line-2:#f4ede4;
  --bg:#fbf7f2; --card:#ffffff; --chip:#fff3e8;
  --ok:#1f9d55; --ok-bg:#e7f6ee; --danger:#c0392b; --danger-bg:#fdecec;
  --info:#2b6cb0; --navy:#22364a;
  --shadow:0 1px 2px rgba(60,40,20,.05),0 8px 24px rgba(120,70,20,.07);
  --shadow-lg:0 12px 40px rgba(120,70,20,.16);
  --r:14px; --r-sm:10px;
  --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --serif:Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--ui); color:var(--ink); background:var(--bg);
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  font-size:15px; line-height:1.5;
}
button{font-family:inherit}
input,select,textarea{font-family:inherit; font-size:15px}
a{color:var(--orange-d)}
.hidden{display:none !important}

/* ---------- App shell ---------- */
#app{min-height:100vh; padding-bottom:88px; max-width:1120px; margin:0 auto}
.topbar{
  position:sticky; top:0; z-index:40; background:rgba(251,247,242,.86);
  backdrop-filter:saturate(1.4) blur(10px); border-bottom:1px solid var(--line);
  display:flex; align-items:center; gap:12px; padding:10px 16px;
}
.topbar .brand{display:flex; align-items:center; gap:10px; min-width:0}
.topbar .brand img{height:34px; width:auto; display:block}
.topbar .brand b{font-weight:800; letter-spacing:-.01em; white-space:nowrap}
.topbar .brand span{color:var(--muted); font-size:12px; white-space:nowrap}
.topbar .spacer{flex:1}
.iconbtn{
  border:1px solid var(--line); background:var(--card); color:var(--ink-soft);
  height:38px; min-width:38px; padding:0 12px; border-radius:10px; cursor:pointer;
  display:inline-flex; align-items:center; gap:7px; font-weight:600; font-size:13.5px;
}
.iconbtn:hover{border-color:var(--gold)}
.iconbtn svg{width:17px;height:17px}

.wrap{padding:16px}
@media(min-width:720px){ .wrap{padding:22px 24px} }

/* ---------- Bottom nav ---------- */
.tabbar{
  position:fixed; left:0; right:0; bottom:0; z-index:45;
  background:rgba(255,255,255,.94); backdrop-filter:blur(10px);
  border-top:1px solid var(--line); display:flex; justify-content:space-around;
  padding:6px 4px calc(6px + env(safe-area-inset-bottom));
}
.tabbar .tab{
  border:0; background:none; color:var(--muted); cursor:pointer;
  display:flex; flex-direction:column; align-items:center; gap:3px;
  font-size:11px; font-weight:600; padding:6px 10px; border-radius:10px; flex:1; max-width:120px;
}
.tabbar .tab svg{width:22px;height:22px}
.tabbar .tab.active{color:var(--orange-d)}
.tabbar .tab.active svg{stroke:var(--orange-d)}

/* ---------- Common ---------- */
.page-h{display:flex; align-items:flex-end; justify-content:space-between; gap:12px; margin:2px 0 16px}
.page-h h1{font-size:22px; margin:0; letter-spacing:-.02em}
.page-h p{margin:2px 0 0; color:var(--muted); font-size:13px}
.section-t{font-size:12px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:22px 2px 10px}

.card{background:var(--card); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow)}
.card.pad{padding:16px}
.grid{display:grid; gap:12px}
@media(min-width:640px){ .g2{grid-template-columns:1fr 1fr} .g3{grid-template-columns:1fr 1fr 1fr} }

.btn{
  border:0; border-radius:11px; padding:11px 16px; font-weight:700; font-size:14.5px;
  cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:8px;
  background:var(--chip); color:var(--orange-d); transition:transform .04s, filter .15s;
}
.btn svg{width:18px;height:18px}
.btn:active{transform:translateY(1px)}
.btn.primary{background:linear-gradient(135deg,var(--gold),var(--orange)); color:#fff; box-shadow:0 6px 16px rgba(242,106,33,.28)}
.btn.primary:hover{filter:brightness(1.04)}
.btn.ghost{background:var(--card); border:1px solid var(--line); color:var(--ink-soft)}
.btn.ghost:hover{border-color:var(--gold); color:var(--ink)}
.btn.danger{background:var(--danger-bg); color:var(--danger)}
.btn.sm{padding:8px 12px; font-size:13px; border-radius:9px}
.btn.block{width:100%}
.btn[disabled]{opacity:.5; cursor:not-allowed}

.quickgrid{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.quick{
  border:1px solid var(--line); background:var(--card); border-radius:var(--r); padding:16px;
  cursor:pointer; text-align:left; display:flex; flex-direction:column; gap:10px; box-shadow:var(--shadow);
}
.quick:hover{border-color:var(--gold); transform:translateY(-1px)}
.quick .ic{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;background:var(--chip)}
.quick .ic svg{width:22px;height:22px;stroke:var(--orange-d)}
.quick b{font-size:15px}
.quick small{color:var(--muted)}

.stat{padding:16px}
.stat .lbl{color:var(--muted); font-size:12px; font-weight:700; letter-spacing:.03em; text-transform:uppercase}
.stat .val{font-size:26px; font-weight:800; letter-spacing:-.02em; margin-top:4px}
.stat .sub{color:var(--muted); font-size:12.5px; margin-top:2px}

/* list rows */
.list{display:flex; flex-direction:column}
.row{
  display:flex; align-items:center; gap:12px; padding:14px 16px; border-bottom:1px solid var(--line-2);
  cursor:pointer; background:var(--card);
}
.row:last-child{border-bottom:0}
.row:hover{background:#fffaf4}
.row .av{width:42px;height:42px;border-radius:11px;background:var(--chip);display:grid;place-items:center;font-weight:800;color:var(--orange-d);flex:none}
.row .main{flex:1; min-width:0}
.row .main b{display:block; font-size:14.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.row .main small{color:var(--muted); display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.row .end{text-align:right; flex:none}
.row .end .amt{font-weight:800}
.row .end small{color:var(--muted)}

.badge{display:inline-block; font-size:11px; font-weight:800; letter-spacing:.03em; padding:3px 9px; border-radius:999px; text-transform:uppercase}
.b-draft{background:#eee9e2;color:#7a6c5c}
.b-sent{background:#e5eefb;color:#2b6cb0}
.b-accepted{background:var(--ok-bg);color:var(--ok)}
.b-declined{background:var(--danger-bg);color:var(--danger)}
.b-expired{background:#f1ede7;color:#8a7c6c}
.b-converted{background:#efe7fb;color:#6b46c1}
.b-finalised{background:var(--ok-bg);color:var(--ok)}
.b-voided{background:var(--danger-bg);color:var(--danger)}
.b-paid{background:var(--ok-bg);color:var(--ok)}
.b-partial{background:#fff2dd;color:#b45309}
.b-unpaid{background:#f1ede7;color:#8a7c6c}

.searchbar{display:flex; gap:8px; margin-bottom:12px}
.searchbar input{flex:1}
.filters{display:flex; gap:8px; overflow-x:auto; padding-bottom:6px; margin-bottom:6px; -webkit-overflow-scrolling:touch}
.chip{border:1px solid var(--line); background:var(--card); color:var(--ink-soft); padding:7px 13px; border-radius:999px; font-size:13px; font-weight:600; white-space:nowrap; cursor:pointer}
.chip.active{background:var(--ink); color:#fff; border-color:var(--ink)}

.empty{text-align:center; padding:44px 20px; color:var(--muted)}
.empty svg{width:46px;height:46px;stroke:var(--line);margin-bottom:10px}
.empty b{display:block;color:var(--ink-soft);font-size:15px;margin-bottom:4px}

/* forms */
.field{margin-bottom:14px}
.field label{display:block; font-size:12.5px; font-weight:700; color:var(--ink-soft); margin-bottom:6px}
.field .hint{color:var(--muted); font-weight:500; font-size:11.5px}
input[type=text],input[type=tel],input[type=email],input[type=number],input[type=date],input[type=time],input[type=password],select,textarea{
  width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:10px; background:#fff; color:var(--ink); outline:none;
}
textarea{resize:vertical; min-height:70px}
input:focus,select:focus,textarea:focus{border-color:var(--gold); box-shadow:0 0 0 3px rgba(251,169,25,.15)}
.frow{display:grid; gap:12px}
@media(min-width:560px){ .frow.c2{grid-template-columns:1fr 1fr} .frow.c3{grid-template-columns:1fr 1fr 1fr} }
.switchrow{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 0; border-top:1px solid var(--line-2)}
.switch{position:relative; width:46px; height:27px; flex:none}
.switch input{opacity:0; width:0; height:0}
.switch .sl{position:absolute; inset:0; background:#dcd3c8; border-radius:999px; transition:.2s; cursor:pointer}
.switch .sl:before{content:""; position:absolute; height:21px; width:21px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.2s; box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch input:checked + .sl{background:var(--orange)}
.switch input:checked + .sl:before{transform:translateX(19px)}

/* line items editor */
.li{display:grid; grid-template-columns:1fr; gap:8px; border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:10px; background:#fff}
.li .li-top{display:flex; gap:8px; align-items:flex-start}
.li .li-top textarea{min-height:44px}
.li .li-nums{display:grid; grid-template-columns:1fr 1fr 1fr auto; gap:8px; align-items:end}
.li .li-nums .amt{align-self:center; font-weight:800; white-space:nowrap; text-align:right; min-width:74px}
.li small{font-size:11px;color:var(--muted);font-weight:700}
.xbtn{border:1px solid var(--line); background:#fff; color:var(--danger); width:38px;height:38px;border-radius:9px;cursor:pointer;flex:none;display:grid;place-items:center}
.xbtn svg{width:16px;height:16px}

.totals{border-top:1px dashed var(--line); margin-top:8px; padding-top:12px}
.totals .tr{display:flex; justify-content:space-between; padding:5px 0; font-size:14px}
.totals .tr.grand{font-size:19px; font-weight:800; border-top:1px solid var(--line); margin-top:6px; padding-top:12px}
.totals .tr .mut{color:var(--muted)}

/* sticky action bar for editors */
.actionbar{
  position:fixed; left:0; right:0; bottom:0; z-index:60; background:rgba(255,255,255,.96);
  backdrop-filter:blur(8px); border-top:1px solid var(--line);
  display:flex; gap:10px; padding:10px 16px calc(10px + env(safe-area-inset-bottom)); max-width:1120px; margin:0 auto;
}
.actionbar .btn{flex:1}

/* modal */
.overlay{position:fixed; inset:0; z-index:80; background:rgba(30,18,8,.44); display:flex; align-items:flex-end; justify-content:center}
@media(min-width:620px){ .overlay{align-items:center} }
.modal{background:#fff; width:100%; max-width:560px; max-height:88vh; border-radius:18px 18px 0 0; overflow:auto; box-shadow:var(--shadow-lg)}
@media(min-width:620px){ .modal{border-radius:18px} }
.modal .mh{position:sticky; top:0; background:#fff; display:flex; align-items:center; justify-content:space-between; padding:16px; border-bottom:1px solid var(--line)}
.modal .mh b{font-size:16px}
.modal .mb{padding:16px}
.pick{display:flex; align-items:center; gap:12px; padding:12px; border:1px solid var(--line); border-radius:11px; margin-bottom:8px; cursor:pointer}
.pick:hover{border-color:var(--gold); background:#fffaf4}
.pick .av{width:38px;height:38px;border-radius:10px;background:var(--chip);display:grid;place-items:center;font-weight:800;color:var(--orange-d)}
.pick b{display:block;font-size:14px}
.pick small{color:var(--muted)}

.toast{position:fixed; left:50%; bottom:96px; transform:translateX(-50%); background:var(--ink); color:#fff; padding:11px 18px; border-radius:12px; font-weight:600; font-size:14px; z-index:200; box-shadow:var(--shadow-lg); opacity:0; transition:opacity .2s, transform .2s}
.toast.show{opacity:1; transform:translateX(-50%) translateY(-4px)}

.kv{display:flex; justify-content:space-between; gap:12px; padding:9px 0; border-bottom:1px solid var(--line-2); font-size:14px}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--muted)}
.kv .v{font-weight:700; text-align:right}

.pillrow{display:flex;flex-wrap:wrap;gap:8px}
.minibtn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 11px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink-soft);display:inline-flex;align-items:center;gap:6px}
.minibtn:hover{border-color:var(--gold);color:var(--ink)}
.minibtn svg{width:15px;height:15px}

/* pin */
.pinwrap{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(160deg,#fff,#fbf1e6)}
.pinbox{width:100%;max-width:340px;text-align:center}
.pinbox img{height:96px;margin-bottom:14px}
.pindots{display:flex;gap:12px;justify-content:center;margin:18px 0 22px}
.pindot{width:14px;height:14px;border-radius:50%;border:2px solid var(--orange);background:transparent}
.pindot.on{background:var(--orange)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.key{height:64px;border-radius:14px;border:1px solid var(--line);background:#fff;font-size:24px;font-weight:700;cursor:pointer;color:var(--ink)}
.key:active{background:var(--chip)}
.key.act{font-size:14px;font-weight:700;color:var(--muted)}

/* ===================== PRINT DOCUMENT ===================== */
#printArea{display:none}
.paper-scroll{overflow:auto; background:#e9e1d6; border-radius:14px; padding:16px; border:1px solid var(--line)}
.doc{
  width:794px; min-height:1123px; background:#fff; margin:0 auto; color:#1c1c1c;
  font-family:var(--serif); position:relative; box-shadow:0 6px 24px rgba(0,0,0,.14);
}
.doc *{box-sizing:border-box}
.doc .pad{padding:46px 50px}
.doc h1,.doc h2,.doc h3{margin:0}
.doc table{width:100%; border-collapse:collapse}
.doc .items th{font-family:var(--ui); font-size:11px; letter-spacing:.04em; text-transform:uppercase; text-align:left; padding:10px 10px}
.doc .items td{padding:11px 10px; font-size:13.5px; vertical-align:top; border-bottom:1px solid #eee}
.doc .items td.n,.doc .items th.n{text-align:right; white-space:nowrap}
.doc .items td.c,.doc .items th.c{text-align:center; white-space:nowrap}
.doc .muted{color:#8a8a8a}
.doc .small{font-size:12px}
.doc .party b{font-family:var(--ui)}
.doc .tot{width:280px; margin-left:auto; font-family:var(--ui); font-size:13.5px}
.doc .tot .r{display:flex; justify-content:space-between; padding:6px 0}
.doc .tot .r.g{font-size:18px; font-weight:800; margin-top:6px; padding-top:10px}
.doc .terms{font-family:var(--ui); font-size:11.5px; color:#555; line-height:1.55}
.doc .bank{font-family:var(--ui); font-size:12px; line-height:1.6}
.doc .stamp{font-family:var(--ui); font-size:11px; letter-spacing:.14em; text-transform:uppercase; font-weight:800}
.doc .eyebrow{font-family:var(--ui); font-size:11px; letter-spacing:.16em; text-transform:uppercase; font-weight:800}
.doc .paidmark{position:absolute; top:150px; right:44px; transform:rotate(-14deg); border:4px solid var(--ok); color:var(--ok); font-family:var(--ui); font-weight:900; font-size:34px; letter-spacing:.06em; padding:6px 18px; border-radius:10px; opacity:.85}
.doc .voidmark{position:absolute; top:150px; right:44px; transform:rotate(-14deg); border:4px solid var(--danger); color:var(--danger); font-family:var(--ui); font-weight:900; font-size:34px; letter-spacing:.1em; padding:6px 18px; border-radius:10px; opacity:.85}

/* preview scaling on small screens */
.paper-scroll .doc{transform-origin:top center}

@media print{
  @page{size:A4; margin:0}
  body{background:#fff}
  #app,.tabbar,.actionbar,.topbar,.toast,.overlay{display:none !important}
  #printArea{display:block !important}
  .doc{box-shadow:none; margin:0; width:100%; min-height:auto}
  .doc .paidmark,.doc .voidmark{opacity:1}
}
</style>
</head>
<body>

<div id="pinScreen" class="hidden"></div>
<div id="app" class="hidden">
  <div class="topbar">
    <div class="brand">
      <img id="brandLogo" alt="Squisito">
      <div>
        <b>Squisito Business</b><br>
        <span id="brandTag">Quotations • Receipts</span>
      </div>
    </div>
    <div class="spacer"></div>
    <button class="iconbtn" data-nav="reports" title="Reports">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><rect x="7" y="11" width="3" height="6"/><rect x="12" y="7" width="3" height="10"/><rect x="17" y="13" width="3" height="4"/></svg>
    </button>
    <button class="iconbtn" data-nav="settings" title="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2V21a2 2 0 0 1-4 0v-.1A1.7 1.7 0 0 0 7 19.4l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.7 1.7 0 0 0 3 12.9H3a2 2 0 0 1 0-4h.1A1.7 1.7 0 0 0 4.6 6l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.7 1.7 0 0 0 10 3.6V3a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 2.9 1.2l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0 .4 2.8h.1a2 2 0 0 1 0 4h-.1"/></svg>
    </button>
  </div>
  <main id="view" class="wrap"></main>
</div>

<nav class="tabbar" id="tabbar">
  <button class="tab" data-nav="dashboard">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12 12 3l9 9"/><path d="M5 10v10h14V10"/></svg>Home</button>
  <button class="tab" data-nav="quotations">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2h9l5 5v15H6z"/><path d="M14 2v5h5"/><path d="M9 13h6M9 17h6"/></svg>Quotes</button>
  <button class="tab" data-nav="receipts">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 2v20l3-2 2 2 2-2 2 2 2-2 3 2V2z"/><path d="M9 8h6M9 12h6"/></svg>Receipts</button>
  <button class="tab" data-nav="customers">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.4"/><path d="M3.5 20a5.5 5.5 0 0 1 11 0"/><path d="M17 8a3 3 0 0 1 0 6M21 20a5 5 0 0 0-4-4.9"/></svg>Clients</button>
  <button class="tab" data-nav="products">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9 12 4l9 5-9 5z"/><path d="M3 9v6l9 5 9-5V9"/></svg>Catalogue</button>
</nav>

<div id="printArea"></div>
<div id="modalRoot"></div>
<div id="toast" class="toast"></div>

<script>
/* ================================================================
   SQUISITO BUSINESS — offline quotations & receipts (single file)
   Data is stored locally in this browser (localStorage). No internet

function load(){
  try{ DB = JSON.parse(localStorage.getItem(KEY)); }catch(e){ DB=null; }
  if(!DB){
    DB = { settings:defaultSettings(), customers:[], products:seedProducts(), quotations:[], receipts:[] };
    save();
  }
  // safety defaults
  DB.settings = Object.assign(defaultSettings(), DB.settings||{});
  DB.settings.counters = DB.settings.counters||{};
  DB.settings.backup = DB.settings.backup || { lastAt:'', sinceCount:0 };
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(DB)); }catch(e){ toast('Storage full or blocked'); } }

function nextNumber(type){
  const y=new Date().getFullYear();
  const key = type+'-'+y;
  const c = DB.settings.counters;
  c[key] = (c[key]||0)+1;
  const prefix = type==='quote'? DB.settings.docs.quotePrefix : DB.settings.docs.receiptPrefix;
  save();
  return `${prefix}-${y}-${String(c[key]).padStart(4,'0')}`;
}

/* ============================ Computations ============================ */
function totals(doc){
  const items = doc.items||[];
  const subtotal = items.reduce((s,i)=> s + num(i.qty)*num(i.rate), 0);
  let discount=0;
  if(doc.discountType==='percent') discount = subtotal * num(doc.discountValue)/100;
  else discount = num(doc.discountValue);
  discount = Math.min(discount, subtotal);
  const afterDiscount = Math.max(subtotal - discount, 0);
  const delivery = num(doc.deliveryCharge);
  const tax = doc.taxEnabled ? afterDiscount * num(doc.taxRate)/100 : 0;
  const grand = afterDiscount + tax + delivery;
  let deposit=0;
  if(doc.depositType==='percent') deposit = grand * num(doc.depositValue)/100;
  else deposit = num(doc.depositValue);
  deposit = Math.min(deposit, grand);
  const paid = (doc.payments||[]).reduce((s,p)=> s+num(p.amount), 0);
  const balance = grand - paid;
  return {subtotal,discount,afterDiscount,delivery,tax,grand,deposit,balanceAfterDeposit:grand-deposit,paid,balance};
}

const S = { view:'dashboard', draft:null, filter:'all', search:'' };

function setActiveTab(){
  $$('.tab').forEach(t=> t.classList.toggle('active', t.dataset.nav===S.view));
}
function nav(view, opts={}){
  S.view=view; S.search=''; if(opts.filter) S.filter=opts.filter;
  window.scrollTo(0,0);
  render();
}
document.addEventListener('click', e=>{
  const n = e.target.closest('[data-nav]');
  if(n){ nav(n.dataset.nav); }
});

function render(){
  setActiveTab();
  const v=$('#view');
  const map={
    dashboard:renderDashboard, quotations:renderList, receipts:renderList,
    customers:renderCustomers, products:renderProducts, reports:renderReports,
    settings:renderSettings
  };
  if(S.view==='quoteEditor'){ v.innerHTML=quotationEditorHTML(); bindQuotationEditor(); return; }
  if(S.view==='receiptEditor'){ v.innerHTML=receiptEditorHTML(); bindReceiptEditor(); return; }
  if(S.view==='customerDetail'){ v.innerHTML=customerDetailHTML(S.detailId); bindCustomerDetail(); return; }
  if(S.view==='docView'){ v.innerHTML=docViewHTML(); bindDocView(); return; }
  (map[S.view]||renderDashboard)();
}

function renderDashboard(){
  const cur = DB.settings.finance.currency;
  const today = todayISO();
  const qToday = DB.quotations.filter(q=> (q.createdAt||'').slice(0,10)===today);
  const valToday = qToday.reduce((s,q)=> s+totals(q).grand, 0);

  DB.receipts.forEach(r=> (r.payments||[]).forEach(p=>{ if((p.date||'')===today) paidToday+=num(p.amount); }));
  const pending = DB.quotations.filter(q=> ['draft','sent'].includes(q.status));
  const pendingVal = pending.reduce((s,q)=> s+totals(q).grand,0);
  let outstanding=0;
  DB.receipts.filter(r=>r.status!=='voided').forEach(r=>{ const t=totals(r); if(t.balance>0) outstanding+=t.balance; });
  const recent = [...DB.quotations.map(d=>({...d,_t:'q'})), ...DB.receipts.map(d=>({...d,_t:'r'}))]
    .sort((a,b)=> (b.updatedAt||b.createdAt||'').localeCompare(a.updatedAt||a.createdAt||'')).slice(0,6);

    <div class="card stat"><div class="lbl">Received today</div><div class="val">${money(paidToday,cur)}</div><div class="sub">across all receipts</div></div>
    <div class="card stat"><div class="lbl">Outstanding</div><div class="val" style="color:${outstanding>0?'var(--danger)':'var(--ok)'}">${money(outstanding,cur)}</div><div class="sub">unpaid balances</div></div>

  $('[data-action="newQuote"]')?.addEventListener('click',()=>openQuotation());
  $('[data-action="newReceipt"]')?.addEventListener('click',()=>openReceipt());
  $('[data-action="backupNow"]')?.addEventListener('click',()=>{ doBackup(); render(); });

  }));

function statusBadge(d,isQ){
  if(isQ) return `<small><span class="badge b-${d.status}">${d.status}</span></small>`;
  const t=totals(d);
  if(d.status==='voided') return `<small><span class="badge b-voided">voided</span></small>`;
  const cls = t.balance<=0.001?'b-paid':(t.paid>0?'b-partial':'b-unpaid');
  const lbl = t.balance<=0.001?'paid':(t.paid>0?'part-paid':'unpaid');
  return `<small><span class="badge ${cls}">${lbl}</span></small>`;
}

function renderList(){
  const isQ = S.view==='quotations';
  const cur=DB.settings.finance.currency;
  const all = isQ? DB.quotations : DB.receipts;
  const filters = isQ
    ? [['all','All'],['draft','Draft'],['sent','Sent'],['accepted','Accepted'],['converted','Converted'],['declined','Declined']]
    : [['all','All'],['unpaid','Unpaid'],['partial','Part-paid'],['paid','Paid'],['voided','Voided']];
  const q = S.search.toLowerCase();
  let items = all.filter(d=>{
    if(q){ const hay=((d.number||'')+' '+((d.customerSnapshot&&d.customerSnapshot.name)||'')+' '+((d.event&&d.event.name)||'')).toLowerCase(); if(!hay.includes(q)) return false; }
    if(S.filter==='all') return true;
    if(isQ) return d.status===S.filter;
    const t=totals(d);
    if(S.filter==='voided') return d.status==='voided';
    if(d.status==='voided') return false;
    if(S.filter==='paid') return t.balance<=0.001;
    if(S.filter==='partial') return t.paid>0 && t.balance>0.001;
    if(S.filter==='unpaid') return t.paid<=0.001;
    return true;
  }).sort((a,b)=> (b.createdAt||'').localeCompare(a.createdAt||''));

  $('#view').innerHTML = `
  <div class="page-h">
    <div><h1>${isQ?'Quotations':'Receipts'}</h1><p>${all.length} total</p></div>
    <button class="btn primary" data-action="new">${IC.plus} New</button>
  </div>
  <div class="searchbar">
    <input type="text" id="searchIn" placeholder="Search number, client or event…" value="${esc(S.search)}">
  </div>
  <div class="filters">${filters.map(([k,l])=>`<button class="chip ${S.filter===k?'active':''}" data-f="${k}">${l}</button>`).join('')}</div>
  <div class="card list">${ items.length? items.map(d=>listRow(d,isQ,cur)).join('') : emptyBlock('No documents','Tap New to create one.') }</div>
  `;
  $('#searchIn').addEventListener('input',e=>{ S.search=e.target.value; debounceRender(); });
  $('[data-action="new"]').addEventListener('click',()=> isQ? openQuotation() : openReceipt());
  $$('#view .chip').forEach(c=> c.addEventListener('click',()=>{ S.filter=c.dataset.f; render(); }));
  $$('#view .row[data-id]').forEach(r=> r.addEventListener('click',()=> isQ? openQuotation(r.dataset.id) : openReceipt(r.dataset.id)));
}

function customerStats(id){
  const qs=DB.quotations.filter(q=>q.customerId===id);
  const rs=DB.receipts.filter(r=>r.customerId===id && r.status!=='voided');
  const quoted=qs.reduce((s,q)=>s+totals(q).grand,0);
  const received=rs.reduce((s,r)=>s+totals(r).paid,0);
  const outstanding=rs.reduce((s,r)=>{const t=totals(r); return s+(t.balance>0?t.balance:0);},0);
  return {q:qs.length,r:rs.length,quoted,received,outstanding};
}

/* ============================ Reports ============================ */
function renderReports(){
  const cur=DB.settings.finance.currency;
  const now=new Date();
  const startWeek=new Date(now); startWeek.setDate(now.getDate()-now.getDay());
  const startMonth=new Date(now.getFullYear(),now.getMonth(),1);
  const inRange=(iso,from)=> iso && new Date(iso)>=from;
  const payments=[]; DB.receipts.filter(r=>r.status!=='voided').forEach(r=>(r.payments||[]).forEach(p=>payments.push(p)));
  const sum=(arr)=>arr.reduce((s,p)=>s+num(p.amount),0);
  const pToday=payments.filter(p=>p.date===todayISO());
  const pWeek=payments.filter(p=>inRange(p.date,startWeek));
  const pMonth=payments.filter(p=>inRange(p.date,startMonth));
  const methods={}; payments.forEach(p=>{ methods[p.method]=(methods[p.method]||0)+num(p.amount); });
  const byStatus=s=>DB.quotations.filter(q=>q.status===s).length;
  let outstanding=0; DB.receipts.filter(r=>r.status!=='voided').forEach(r=>{const t=totals(r); if(t.balance>0) outstanding+=t.balance;});
  const topCust=DB.customers.map(c=>({c,st:customerStats(c.id)})).filter(x=>x.st.received>0).sort((a,b)=>b.st.received-a.st.received).slice(0,5);

  $('#view').innerHTML=`
  <div class="page-h"><div><h1>Reports</h1><p>Everything is calculated on this device</p></div></div>
  <div class="section-t">Payments received</div>
  <div class="grid g3">
    <div class="card stat"><div class="lbl">Today</div><div class="val">${money(sum(pToday),cur)}</div><div class="sub">${pToday.length} payments</div></div>
    <div class="card stat"><div class="lbl">This week</div><div class="val">${money(sum(pWeek),cur)}</div><div class="sub">${pWeek.length} payments</div></div>
    <div class="card stat"><div class="lbl">This month</div><div class="val">${money(sum(pMonth),cur)}</div><div class="sub">${pMonth.length} payments</div></div>
  </div>
  <div class="section-t">Quotations</div>
  <div class="card pad">
    <div class="kv"><span class="k">Total issued</span><span class="v">${DB.quotations.length}</span></div>
    <div class="kv"><span class="k">Accepted</span><span class="v">${byStatus('accepted')+byStatus('converted')}</span></div>
    <div class="kv"><span class="k">Pending (draft/sent)</span><span class="v">${byStatus('draft')+byStatus('sent')}</span></div>
    <div class="kv"><span class="k">Declined</span><span class="v">${byStatus('declined')}</span></div>
    <div class="kv"><span class="k">Value quoted</span><span class="v">${money(DB.quotations.reduce((s,q)=>s+totals(q).grand,0),cur)}</span></div>
  </div>
  <div class="section-t">Outstanding & methods</div>
  <div class="card pad">
    <div class="kv"><span class="k">Outstanding balances</span><span class="v" style="color:${outstanding>0?'var(--danger)':'var(--ok)'}">${money(outstanding,cur)}</span></div>
    ${Object.keys(methods).length? Object.entries(methods).map(([m,v])=>`<div class="kv"><span class="k">${esc(m)}</span><span class="v">${money(v,cur)}</span></div>`).join('') : '<div class="kv"><span class="k">Payment methods</span><span class="v">—</span></div>'}
  </div>
  <div class="section-t">Top clients by received</div>
  <div class="card list">${ topCust.length? topCust.map(x=>`<div class="row"><div class="av">${initials(x.c.name)}</div><div class="main"><b>${esc(x.c.name)}</b><small>${x.st.r} receipts</small></div><div class="end"><div class="amt">${money(x.st.received,cur)}</div></div></div>`).join('') : emptyBlock('No data','Record some payments first.') }</div>
  <div style="height:14px"></div>
  <button class="btn ghost block" data-action="csv">${IC.download} Export payments to CSV</button>
  <div style="height:24px"></div>`;
  $('[data-action="csv"]').addEventListener('click',exportCSV);
}
function exportCSV(){
  const rows=[['Receipt','Client','Date','Method','Reference','Amount','Currency']];
  DB.receipts.filter(r=>r.status!=='voided').forEach(r=>(r.payments||[]).forEach(p=>{
    rows.push([r.number, (r.customerSnapshot&&r.customerSnapshot.name)||'', p.date||'', p.method||'', p.reference||'', num(p.amount).toFixed(2), r.currency||DB.settings.finance.currency]);
  }));
  const csv=rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  downloadBlob(new Blob([csv],{type:'text/csv'}), `Squisito_payments_${todayISO()}.csv`);
  toast('CSV downloaded');
}
function downloadBlob(blob,name){
  const url=URL.createObjectURL(blob); const a=document.createElement('a');
  a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1500);
}

function bindSettings(){
  $('#logoIn')?.addEventListener('change',e=>{
    const f=e.target.files[0]; if(!f) return;
    const r=new FileReader(); r.onload=()=>{ DB.settings.logo=r.result; save(); toast('Logo updated'); render(); }; r.readAsDataURL(f);
  });
  $('#sec_on').addEventListener('change',e=> $('#pinField').classList.toggle('hidden',!e.target.checked));
  $('[data-action="backup"]').addEventListener('click',doBackup);
  $('#restoreIn').addEventListener('change',e=>doRestore(e.target.files[0]));
  $('[data-action="reset"]').addEventListener('click',()=>{ if(confirmDo('This permanently erases ALL data on this device. A backup cannot be recovered afterwards unless you saved one. Continue?')){ localStorage.removeItem(KEY); load(); toast('All data erased'); nav('dashboard'); }});
  $('[data-action="saveSettings"]').addEventListener('click',()=>{
    const g=id=>$('#'+id).value;
    const s=DB.settings;
    s.company={legalName:g('c_legal'),tradingName:g('c_trade'),address:g('c_addr'),phone:g('c_phone'),whatsapp:g('c_wa'),email:g('c_email'),website:g('c_web'),regInfo:g('c_reg'),taxInfo:g('c_tax')};
    s.bank={bankName:g('b_bank'),accountName:g('b_name'),accountType:g('b_type'),accountNumber:g('b_num'),branch:g('b_branch')};
    s.finance={currency:g('f_cur'),taxEnabled:$('#f_taxon').checked,taxLabel:g('f_taxlabel'),taxRate:num(g('f_taxrate')),defaultDepositPct:num(g('f_dep')),validityDays:num(g('f_valid'))};
    s.docs={quotePrefix:g('d_qp'),receiptPrefix:g('d_rp'),defaultTemplate:g('d_tpl'),terms:g('d_terms'),cancellation:g('d_cancel'),thankYou:g('d_thanks'),preparedBy:g('d_prep')};
    s.security={pin: $('#sec_on').checked ? (g('sec_pin')||'').slice(0,4) : ''};
    save(); toast('Settings saved'); render();
  });
}
function doBackup(){
  DB.settings.backup={ lastAt:new Date().toISOString(), sinceCount:0 };
  save();
  const blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
  downloadBlob(blob, `Squisito_Backup_${todayISO()}.json`);
  S.backupDismissed=false;
  toast('Backup downloaded');
}
function bumpBackup(){ const b=DB.settings.backup||(DB.settings.backup={lastAt:'',sinceCount:0}); b.sinceCount=(b.sinceCount||0)+1; }
function needsBackup(){
  const b=DB.settings.backup||{};
  const total=DB.quotations.length+DB.receipts.length;
  if(total===0) return false;
  if((b.sinceCount||0)>=10) return true;
  if(!b.lastAt) return total>=3;
  const days=(Date.now()-new Date(b.lastAt).getTime())/86400000;
  return days>=7;
}
function backupReason(){
  const b=DB.settings.backup||{}; const cnt=b.sinceCount||0;
  if(cnt>=10) return `You've saved ${cnt} documents since your last backup. Download a copy so you don't lose them.`;
  if(!b.lastAt) return `You haven't backed up yet. If this phone is lost or cleared, your records go with it.`;
  return `Your last backup was ${fmtDate((b.lastAt||'').slice(0,10))}. A weekly backup keeps your records safe.`;
}
function backupBannerHTML(){
  if(S.backupDismissed || !needsBackup()) return '';
  return `<div class="card pad" style="background:#fff5ec;border-color:#f6c99a;margin-bottom:6px">
    <div style="display:flex;align-items:flex-start;gap:10px">
      <div style="font-size:20px;line-height:1">⚠️</div>
      <div style="flex:1">
        <b style="font-family:var(--ui)">Back up your records</b>
        <div class="hint" style="margin:3px 0 10px">${esc(backupReason())}</div>
        <div class="pillrow">
          <button class="btn primary sm" data-action="backupNow">${IC.download} Download backup</button>
          <button class="btn ghost sm" data-action="backupLater">Later</button>
        </div>
      </div>
    </div></div>`;
}
function doRestore(file){
  if(!file) return;
  const r=new FileReader();
  r.onload=()=>{ try{ const data=JSON.parse(r.result);
    if(!data.settings||!Array.isArray(data.quotations)) throw 0;
    if(confirmDo('Restore will REPLACE all current data with the backup. Continue?')){ DB=data; DB.settings=Object.assign(defaultSettings(),DB.settings); save(); toast('Backup restored'); nav('dashboard'); }
  }catch(e){ toast('That file is not a valid Squisito backup'); } };
  r.readAsText(file);
}

function rebindClient(type){ $('[data-action="pickClient"]').addEventListener('click',()=> customerPicker(c=>{ S.draft.customerId=c.id; S.draft.customerSnapshot={name:c.name,company:c.company,phone:c.phone,whatsapp:c.whatsapp,email:c.email,address:c.address}; closeModal(); $('#clientCard').innerHTML=customerCardHTML(S.draft); rebindClient(type); })); }
function saveQuotation(validate){
  const d=S.draft;
  if(validate){ if(!d.customerSnapshot){ toast('Choose a client first'); return false; } if(!d.items.length){ toast('Add at least one item'); return false; } }
  d.updatedAt=new Date().toISOString();
  if(d._new){ d.number=nextNumber('quote'); d._new=false; DB.quotations.push(d); }
  else { const i=DB.quotations.findIndex(x=>x.id===d.id); if(i>=0) DB.quotations[i]=d; else DB.quotations.push(d); }
  bumpBackup(); save(); toast('Quotation saved'); return true;
}
function convertToReceipt(){
  if(!saveQuotation(true)) return;
  const q=S.draft;

    customerId:q.customerId, customerSnapshot:JSON.parse(JSON.stringify(q.customerSnapshot||null)),
    event:JSON.parse(JSON.stringify(q.event)), currency:q.currency, items:JSON.parse(JSON.stringify(q.items)),
    discountType:q.discountType, discountValue:q.discountValue, taxEnabled:q.taxEnabled, taxRate:q.taxRate,
    deliveryCharge:q.deliveryCharge, payments:[], notes:'', receivedBy:DB.settings.docs.preparedBy, templateId:q.templateId };
  // carry deposit as suggested first payment? leave to user.
  q.status='converted'; save();
  S.draft=r; S.view='receiptEditor'; window.scrollTo(0,0); render();
  toast('Converted — now record payment');
}

  $('[data-action="void"]')?.addEventListener('click',()=>{ if(confirmDo('Void this receipt? It stays for the record but is marked void.')){ S.draft.status='voided'; S.draft.voidedAt=new Date().toISOString(); saveReceipt(false); render(); }});
  $('[data-action="delReceipt"]')?.addEventListener('click',()=>{ if(confirmDo('Delete this receipt?')){ DB.receipts=DB.receipts.filter(x=>x.id!==S.draft.id); save(); nav('receipts'); }});
  $('[data-action="save"]').addEventListener('click',()=>{ if(saveReceipt(true)) nav('receipts'); });
  $('[data-action="savePreview"]').addEventListener('click',()=>{ if(saveReceipt(true)){ S.docRef={type:'receipt',id:S.draft.id}; nav('docView'); } });
}
function saveReceipt(validate){
  const d=S.draft;
  if(validate){ if(!d.customerSnapshot){ toast('Choose a client first'); return false; } if(!d.items.length){ toast('Add at least one item'); return false; } }
  d.updatedAt=new Date().toISOString();
  if(d._new){ d.number=nextNumber('receipt'); d._new=false; DB.receipts.push(d); }
  else { const i=DB.receipts.findIndex(x=>x.id===d.id); if(i>=0) DB.receipts[i]=d; else DB.receipts.push(d); }
  bumpBackup(); save(); toast('Receipt saved'); return true;
}

/* ============================ Document rendering (6 templates) ============================ */
const ORANGE='#F26A21', GOLD='#FBA919', NAVY='#22364a', INK='#1c1c1c';
function compLines(){ const c=DB.settings.company; return [c.address, c.phone&&'Tel '+c.phone, c.whatsapp&&'WhatsApp '+c.whatsapp, c.email, c.website].filter(Boolean).map(esc).join('&nbsp;&nbsp;·&nbsp;&nbsp;'); }
function compName(){ const c=DB.settings.company; return esc(c.tradingName||c.legalName); }
function docTitle(type){ return type==='quote'?'QUOTATION':'RECEIPT'; }
function validUntil(doc){ const d=new Date(doc.createdAt); d.setDate(d.getDate()+num(doc.validityDays||0)); return d.toISOString().slice(0,10); }
function tItems(doc){ const c=doc.currency; return (doc.items||[]).map(it=>`<tr><td>${nl2br(it.description)}</td><td class="c">${esc(String(+num(it.qty)))}</td><td class="c">${esc(it.unit||'')}</td><td class="n">${money(it.rate,c)}</td><td class="n">${money(num(it.qty)*num(it.rate),c)}</td></tr>`).join(''); }
function itemsTable(doc, headBg, headColor){
  return `<table class="items"><thead><tr style="background:${headBg};color:${headColor}">
    <th>Description</th><th class="c">Qty</th><th class="c">Unit</th><th class="n">Rate</th><th class="n">Amount</th></tr></thead>
    <tbody>${tItems(doc)}</tbody></table>`;
}
function tTotals(doc,type){
  const c=doc.currency,t=totals(doc),s=DB.settings; let h='';
  h+=`<div class="r"><span>Subtotal</span><span>${money(t.subtotal,c)}</span></div>`;
  if(t.discount>0) h+=`<div class="r"><span>Discount</span><span>− ${money(t.discount,c)}</span></div>`;
  if(doc.taxEnabled) h+=`<div class="r"><span>${esc(s.finance.taxLabel)} ${num(doc.taxRate)}%</span><span>${money(t.tax,c)}</span></div>`;
  if(t.delivery>0) h+=`<div class="r"><span>Delivery / service</span><span>${money(t.delivery,c)}</span></div>`;
  h+=`<div class="r g"><span>Total</span><span>${money(t.grand,c)}</span></div>`;
  if(type==='quote'){ if(t.deposit>0) h+=`<div class="r"><span>Deposit required</span><span>${money(t.deposit,c)}</span></div><div class="r"><span>Balance</span><span>${money(t.balanceAfterDeposit,c)}</span></div>`; }
  else { h+=`<div class="r"><span>Amount paid</span><span>${money(t.paid,c)}</span></div><div class="r g" style="color:${t.balance<=0.001?'#1f9d55':'#c0392b'}"><span>${t.balance<=0.001?'Paid in full':'Balance due'}</span><span>${money(Math.max(t.balance,0),c)}</span></div>`; }
  return h;
}
function tParty(doc,label='Bill to'){ const c=doc.customerSnapshot||{}; return `<div class="party"><div class="eyebrow" style="color:${ORANGE};margin-bottom:5px">${label}</div>
  <b style="font-size:15px">${esc(c.name||'—')}</b>${c.company?`<div>${esc(c.company)}</div>`:''}${c.address?`<div class="small muted">${esc(c.address)}</div>`:''}${c.phone?`<div class="small">${esc(c.phone)}</div>`:''}${c.email?`<div class="small">${esc(c.email)}</div>`:''}</div>`; }
function tEventRows(doc){ const e=doc.event||{}; const r=[]; if(e.name)r.push(['Event',e.name]); if(e.type)r.push(['Type',e.type]);
  if(e.multiDay && e.date){
    const span = fmtDate(e.date) + ' — ' + (e.endDate?fmtDate(e.endDate):'…');
    r.push(['Dates', span]);
    const tt = [e.time,e.endTime].filter(Boolean).join(' – ');
    if(tt) r.push(['Time', tt]);
  } else if(e.date){
    r.push(['Date', fmtDate(e.date)+(e.time?', '+e.time:'')]);
  }
  if(e.venue)r.push(['Venue',e.venue]); if(e.guests)r.push(['Guests',e.guests]); if(e.delivery)r.push(['Service',e.delivery]); return r; }
function tBank(){ const b=DB.settings.bank; return `<div><b class="small" style="font-family:var(--ui)">Banking details</b><div class="bank">${esc(b.bankName)}<br>${esc(b.accountName)}<br>${esc(b.accountType)} Account: ${esc(b.accountNumber)}<br>Branch: ${esc(b.branch)}</div></div>`; }
function tPaymentsList(doc){ if(!(doc.payments||[]).length) return ''; const c=doc.currency; return `<div style="margin-top:10px"><b class="small" style="font-family:var(--ui)">Payments received</b><div class="bank">${doc.payments.map(p=>`${fmtDate(p.date)} — ${esc(p.method)}${p.reference?' ('+esc(p.reference)+')':''}: ${money(p.amount,c)}`).join('<br>')}</div></div>`; }
function stampFor(doc,type){ if(type==='receipt'){ if(doc.status==='voided') return '<div class="voidmark">VOID</div>'; if(totals(doc).balance<=0.001) return '<div class="paidmark">PAID</div>'; } return ''; }
function tTermsQuote(doc){ const s=DB.settings.docs; const terms=doc.paymentTerms||''; return `<div class="terms">
  ${terms?`<b>Payment terms:</b> ${nl2br(terms)}<br>`:''}
  ${s.terms?`<b>Terms:</b> ${nl2br(s.terms)}<br>`:''}
  ${doc.cancellationTerms?`<b>Cancellation:</b> ${nl2br(doc.cancellationTerms)}<br>`:''}
  ${doc.notes?`<br><b>Notes:</b> ${nl2br(doc.notes)}`:''}</div>`; }
function tThanks(doc){ return `<div class="terms">${doc.notes?nl2br(doc.notes)+'<br><br>':''}${esc(DB.settings.docs.thankYou)}</div>`; }
function metaLine(doc,type){
  const rows=[[docTitle(type)+' No.', doc.number||'—'],['Date', fmtDate((doc.createdAt||'').slice(0,10))]];
  if(type==='quote') rows.push(['Valid until', fmtDate(validUntil(doc))]);
  else rows.push(['Prepared by', doc.receivedBy||'']);
  if(type==='quote' && doc.preparedBy) rows.push(['Prepared by', doc.preparedBy]);
  return rows;
}

  $('[data-action="edit"]').addEventListener('click',()=> type==='quote'?openQuotation(doc.id):openReceipt(doc.id));
  $$('#view [data-tpl]').forEach(b=> b.addEventListener('click',()=>{ doc.templateId=b.dataset.tpl; save(); render(); }));
  $('[data-action="print"]').addEventListener('click',()=> printDoc());
  $('[data-action="wa"]').addEventListener('click',()=> shareWA());
  $('[data-action="copy"]').addEventListener('click',()=> copySummary());
  requestAnimationFrame(scalePreview);
  window.onresize=()=>{ if(S.view==='docView') scalePreview(); };
}
function scalePreview(){
  const wrap=$('#paperWrap'), doc=$('#theDoc'); if(!wrap||!doc) return;
  doc.style.transform='none';
  const avail=wrap.clientWidth-32;
  const scale=Math.min(1, avail/794);
  doc.style.transformOrigin='top left';
  doc.style.transform=`scale(${scale})`;
  wrap.style.height=(doc.offsetHeight*scale+8)+'px';
}
function docFileName(doc,type){
  const name=((doc.customerSnapshot&&doc.customerSnapshot.name)||'Client').trim();
  const numb=(doc.number||docTitle(type)).trim();
  return (name+' - '+numb).replace(/[\/\\:*?"<>|]+/g,' ').replace(/\s+/g,' ').trim();
}
function printDoc(){
  const {doc,type}=getDoc();
  $('#printArea').innerHTML=`<div class="doc ${doc.templateId}">${renderTemplate(doc,type)}</div>`;
  S._prevTitle=document.title;
  document.title=docFileName(doc,type);
  window.print();
}
window.addEventListener('afterprint',()=>{ $('#printArea').innerHTML=''; if(S._prevTitle!=null){ document.title=S._prevTitle; S._prevTitle=null; } });
function summaryText(){
  const {doc,type}=getDoc(); const t=totals(doc); const c=doc.currency;
  const L=[compName(), `${docTitle(type)}: ${doc.number||''}`, `Client: ${(doc.customerSnapshot&&doc.customerSnapshot.name)||''}`, `Total: ${money(t.grand,c)}`];
  if(type==='quote'&&t.deposit>0) L.push(`Deposit: ${money(t.deposit,c)}`);
  if(type==='receipt') L.push(t.balance<=0.001?'Status: PAID IN FULL':`Balance due: ${money(t.balance,c)}`);
  return L.join('\n');
}
function shareWA(){
  const {doc}=getDoc();
  const text=encodeURIComponent(summaryText()+'\n\n'+DB.settings.docs.thankYou);
  const wa=((doc.customerSnapshot&&doc.customerSnapshot.whatsapp)||'').replace(/\D/g,'');
  window.open(wa?`https://wa.me/${wa}?text=${text}`:`https://wa.me/?text=${text}`,'_blank');
}
function copySummary(){ const txt=summaryText(); if(navigator.clipboard){ navigator.clipboard.writeText(txt).then(()=>toast('Summary copied')); } else { toast('Copy not supported'); } }

/* ============================ PIN & startup ============================ */
let pinEntry='';
function renderPin(){
  const el=$('#pinScreen'); el.classList.remove('hidden'); $('#app').classList.add('hidden');
  el.innerHTML=`<div class="pinwrap"><div class="pinbox">
    <img src="${DB.settings.logo}">
    <div style="font-weight:800;font-size:18px">Squisito Business</div>
    <div style="color:var(--muted);font-size:13px;margin-top:4px">Enter your PIN</div>
    <div class="pindots" id="dots"></div>
    <div class="keys">${[1,2,3,4,5,6,7,8,9].map(n=>`<button class="key" data-k="${n}">${n}</button>`).join('')}
      <button class="key act" data-k="clear">Clear</button>
      <button class="key" data-k="0">0</button>
      <button class="key act" data-k="del">⌫</button></div>
  </div></div>`;
  drawDots();
  $$('#pinScreen .key').forEach(b=> b.addEventListener('click',()=>{
    const k=b.dataset.k;
    if(k==='clear') pinEntry='';
    else if(k==='del') pinEntry=pinEntry.slice(0,-1);
    else if(pinEntry.length<4) pinEntry+=k;
    drawDots();
    if(pinEntry.length===4){ if(pinEntry===DB.settings.security.pin){ pinEntry=''; unlock(); } else { toast('Wrong PIN'); pinEntry=''; setTimeout(drawDots,120); } }
  }));
}
function drawDots(){ const d=$('#dots'); if(!d) return; d.innerHTML=[0,1,2,3].map(i=>`<div class="pindot ${i<pinEntry.length?'on':''}"></div>`).join(''); }
function unlock(){ $('#pinScreen').classList.add('hidden'); $('#pinScreen').innerHTML=''; $('#app').classList.remove('hidden'); render(); }

function boot(){
  load();
  $('#brandLogo').src=DB.settings.logo;
  $('#brandTag').textContent='Quotations • Receipts';
  if(DB.settings.security.pin){ renderPin(); }
  else { $('#app').classList.remove('hidden'); render(); }
}
boot();

</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('service-worker.js').catch(function (err) {
      console.warn('Service worker registration failed:', err);
    });
  });
}
</script>
